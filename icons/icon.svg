<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a00" />
      <stop offset="100%" stop-color="#ee0914" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Fondo Oscuro -->
  <rect width="512" height="512" rx="108" fill="#0b0d10" />
  <rect width="496" height="496" x="8" y="8" rx="100" fill="#141821" stroke="rgba(255,255,255,0.1)" stroke-width="4" />
  
  <!-- Matriz de 8x8 puntos de fondo oscuros -->
  <g fill="rgba(255,255,255,0.06)">
    <circle cx="120" cy="120" r="12" /><circle cx="160" cy="120" r="12" /><circle cx="200" cy="120" r="12" /><circle cx="240" cy="120" r="12" /><circle cx="280" cy="120" r="12" /><circle cx="320" cy="120" r="12" /><circle cx="360" cy="120" r="12" /><circle cx="400" cy="120" r="12" />
    <circle cx="120" cy="160" r="12" /><circle cx="160" cy="160" r="12" /><circle cx="200" cy="160" r="12" /><circle cx="240" cy="160" r="12" /><circle cx="280" cy="160" r="12" /><circle cx="320" cy="160" r="12" /><circle cx="360" cy="160" r="12" /><circle cx="400" cy="160" r="12" />
    <circle cx="120" cy="200" r="12" /><circle cx="160" cy="200" r="12" /><circle cx="200" cy="200" r="12" /><circle cx="240" cy="200" r="12" /><circle cx="280" cy="200" r="12" /><circle cx="320" cy="200" r="12" /><circle cx="360" cy="200" r="12" /><circle cx="400" cy="200" r="12" />
    <circle cx="120" cy="240" r="12" /><circle cx="160" cy="240" r="12" /><circle cx="200" cy="240" r="12" /><circle cx="240" cy="240" r="12" /><circle cx="280" cy="240" r="12" /><circle cx="320" cy="240" r="12" /><circle cx="360" cy="240" r="12" /><circle cx="400" cy="240" r="12" />
    <circle cx="120" cy="280" r="12" /><circle cx="160" cy="280" r="12" /><circle cx="200" cy="280" r="12" /><circle cx="240" cy="280" r="12" /><circle cx="280" cy="280" r="12" /><circle cx="320" cy="280" r="12" /><circle cx="360" cy="280" r="12" /><circle cx="400" cy="280" r="12" />
    <circle cx="120" cy="320" r="12" /><circle cx="160" cy="320" r="12" /><circle cx="200" cy="320" r="12" /><circle cx="240" cy="320" r="12" /><circle cx="280" cy="320" r="12" /><circle cx="320" cy="320" r="12" /><circle cx="360" cy="320" r="12" /><circle cx="400" cy="320" r="12" />
    <circle cx="120" cy="360" r="12" /><circle cx="160" cy="360" r="12" /><circle cx="200" cy="360" r="12" /><circle cx="240" cy="360" r="12" /><circle cx="280" cy="360" r="12" /><circle cx="320" cy="360" r="12" /><circle cx="360" cy="360" r="12" /><circle cx="400" cy="360" r="12" />
    <circle cx="120" cy="400" r="12" /><circle cx="160" cy="400" r="12" /><circle cx="200" cy="400" r="12" /><circle cx="240" cy="400" r="12" /><circle cx="280" cy="400" r="12" /><circle cx="320" cy="400" r="12" /><circle cx="360" cy="400" r="12" /><circle cx="400" cy="400" r="12" />
  </g>

  <!-- Patrón de LEDs Encendidos iluminando la Letra 'M' (de MatrixMind) en gradiente rojo/naranja brillante -->
  <g fill="url(#matrixGrad)" filter="url(#glow)">
    <!-- Columna Izquierda -->
    <circle cx="140" cy="160" r="15" /><circle cx="140" cy="200" r="15" /><circle cx="140" cy="240" r="15" /><circle cx="140" cy="280" r="15" /><circle cx="140" cy="320" r="15" /><circle cx="140" cy="360" r="15" />
    <!-- Columna Derecha -->
    <circle cx="380" cy="160" r="15" /><circle cx="380" cy="200" r="15" /><circle cx="380" cy="240" r="15" /><circle cx="380" cy="280" r="15" /><circle cx="380" cy="320" r="15" /><circle cx="380" cy="360" r="15" />
    <!-- Diagonal hacia el centro -->
    <circle cx="190" cy="210" r="15" /><circle cx="240" cy="260" r="15" /><circle cx="280" cy="260" r="15" /><circle cx="330" cy="210" r="15" />
  </g>
</svg>
